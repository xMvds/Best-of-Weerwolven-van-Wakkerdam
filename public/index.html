<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wakkerdam Online Helper — Speler</title>
  <link rel="stylesheet" href="/style.css?v=0.3.31" />
</head>
<body class="playerScreen">
  <div class="bg"></div>
  <main class="wrap playerWrap">
    <section id="joinCard" class="joinScreenHero simpleJoinScreen">
      <div class="joinHeroInner simpleJoinInner">
        <label class="joinPrompt" for="nameInput">Vul je naam in</label>
        <input id="nameInput" placeholder="Naam" maxlength="18" autocomplete="name" autofocus />
      </div>
    </section>

    <section id="gameUI" class="playerStage hidden">
      <div id="actionBox" class="playerActionPanel">Wacht op de host...</div>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/player.js?v=0.3.31"></script>
</body>
</html>
