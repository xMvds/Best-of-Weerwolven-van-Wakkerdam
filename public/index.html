<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Wakkerdam Online Helper — Speler</title>
  <link rel="stylesheet" href="/style.css?v=0.3.57" />
</head>
<body class="playerScreen">
  <div class="bg"></div>
  <main class="wrap playerWrap">
    <section id="joinCard" class="joinScreenHero simpleJoinScreen">
      <div class="joinHeroInner simpleJoinInner">
        <label class="joinPrompt" for="nameInput">Vul je naam in</label>
        <form id="joinForm" class="joinForm">
          <input id="nameInput" placeholder="Naam" maxlength="18" autocomplete="name" enterkeyhint="join" autofocus />
          <button id="joinBtn" class="btn primary joinSubmitBtn" type="submit">Meedoen met het spel</button>
        </form>
      </div>
    </section>

    <section id="gameUI" class="playerStage hidden">
      <div id="actionBox" class="playerActionPanel">Wacht op de host...</div>
    </section>
  </main>
  <button id="roleInfoFab" class="roleInfoFab hidden" type="button" aria-label="Bekijk rolinformatie" aria-expanded="false">I</button>
  <aside id="roleInfoPanel" class="roleInfoPanel hidden" aria-label="Rolinformatie">
    <button id="roleInfoClose" class="roleInfoClose" type="button" aria-label="Sluiten">×</button>
    <div id="roleInfoContent"></div>
  </aside>
  <div id="playerDebugFab" class="playerDebugFab hidden">
    <button id="playerDebugClose" class="btn ghost smallBtn" type="button">×</button>
    <strong>Debug</strong>
    <button id="openInfoFromPlayer" class="btn ghost" type="button">Open Infoscherm</button>
    <button id="openHostFromPlayer" class="btn ghost" type="button">Open Hostscherm</button>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/peek-system.js?v=0.3.57"></script>
  <script src="/peek-mechanics.js?v=0.3.57"></script>
  <script src="/player.js?v=0.3.57"></script>
</body>
</html>
